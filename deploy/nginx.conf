server {
    listen 80;
    server_name lanhu.mcp.paxcq.com;
    location /.well-known/acme-challenge/ { root /var/www/lanhu-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name lanhu.mcp.paxcq.com;
    ssl_certificate /etc/letsencrypt/live/lanhu.mcp.paxcq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lanhu.mcp.paxcq.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:5188;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
    # OAuth callbacks and MCP data must not be retained in URL/access logs.
    access_log off;
    error_log /www/wwwlogs/lanhu-mcp.error.log warn;
}
