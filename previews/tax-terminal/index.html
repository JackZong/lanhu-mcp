function toast(message,error=false){$('toast').textContent=message;$('toast').className='toast'+(error?' error':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),3200)}
function statusDot(status){return '<span class="dot '+(status==='启用'||status==='申请成功'||status==='已开通'?'green':status==='已申请'?'blue':status==='待核实'?'orange':status.includes('失败')||status==='停用'?'red':'')+'"></span>'+escapeHtml(status)}
function render(){const start=(page-1)*pageSize;const rows=filtered.slice(start,start+pageSize);$('terminal-rows').innerHTML=rows.length?rows.map(r=>`<tr><td class="sn" title="${escapeHtml(r.sn)}">${escapeHtml(r.sn)}</td><td title="${escapeHtml(r.merchant)}">${escapeHtml(r.merchant)}</td><td title="${escapeHtml(r.merchantId)}">${escapeHtml(r.merchantId)}</td><td>${statusDot(r.status)}</td><td>${statusDot(r.application)}</td><td title="${r.applied}">${r.applied}</td><td>${statusDot(r.activation)}</td><td title="${r.activated}">${r.activated}</td><td><div class="row-actions">${r.application==='申请成功'?`<button data-action="activation" data-id="${r.id}" title="${r.activation==='已开通'?'查看开通状态':'演示开通报税'}" aria-label="${escapeHtml(r.sn)} 开通状态">${icon('check')}</button><button class="danger-action" data-action="cancel" data-id="${r.id}" title="演示关闭报税" aria-label="${escapeHtml(r.sn)} 关闭报税">${icon('stop')}</button>`:''}<button data-action="details" data-id="${r.id}" title="查看详情" aria-label="查看 ${escapeHtml(r.sn)} 详情">${icon(r.application==='未申请'?'settings':'eye')}</button></div></td></tr>`).join(''):`<tr><td colspan="9" class="empty">${icon('list')}暂无符合条件的报税终端</td></tr>`;
const pages=Math.max(1,Math.ceil(filtered.length/pageSize));$('pager').innerHTML=`<span>共 ${filtered.length.toLocaleString()} 条</span><select class="page-size" id="page-size" aria-label="每页条数">${[10,20,50].map(n=>`<option value="${n}" ${n===pageSize?'selected':''}>${n}条/页</option>`).join('')}</select><button class="page-btn" data-page="${page-1}" ${page===1?'disabled':''} aria-label="上一页">‹</button>${Array.from({length:pages},(_,i)=>`<button class="page-btn ${page===i+1?'active':''}" data-page="${i+1}" aria-label="第 ${i+1} 页" ${page===i+1?'aria-current="page"':''}>${i+1}</button>`).join('')}<button class="page-btn" data-page="${page+1}" ${page===pages?'disabled':''} aria-label="下一页">›</button><span>前往</span><input class="jump" id="jump" type="number" min="1" max="${pages}" value="${page}" aria-label="跳转页码"><span>页</span>`;
$('page-size').onchange=e=>{pageSize=Number(e.target.value);page=1;render()};$('jump').onchange=e=>{const n=Number(e.target.value);page=Math.min(pages,Math.max(1,Number.isFinite(n)?Math.floor(n):1));render()};}
function search(){const values={sn:$('sn').value.trim().toLowerCase(),merchant:$('merchant').value.trim().toLowerCase(),merchantId:$('merchant-id').value.trim().toLowerCase(),application:$('application').value,activation:$('activation').value};filtered=records.filter(r=>r.sn.toLowerCase().includes(values.sn)&&r.merchant.toLowerCase().includes(values.merchant)&&r.merchantId.toLowerCase().includes(values.merchantId)&&(!values.application||r.application===values.application)&&(!values.activation||r.activation===values.activation));page=1;render()}
function details(id){selected=records.find(r=>r.id===id);$('detail-id').textContent=selected.merchantId;$('detail-merchant').textContent=selected.merchant;$('detail-sn').textContent=selected.sn;$('key-rows').innerHTML=selected.history.length?selected.history.map(h=>`<tr><td>${escapeHtml(h.code)}</td><td>${escapeHtml(h.key)}</td><td>${escapeHtml(h.at)}</td><td>${escapeHtml(h.by)}</td></tr>`).join('')+Array.from({length:Math.max(0,10-selected.history.length)},()=>'<tr aria-hidden="true"><td>&nbsp;</td><td></td><td></td><td></td></tr>').join(''):'<tr><td colspan="4" class="empty">暂无 Key 更新记录</td></tr>';$('key-pager').innerHTML=`<span class="total">共 ${selected.history.length} 条记录${selected.history.length?' 第 1/1 页':''}</span><button class="page-btn" disabled aria-label="上一页">‹</button><button class="page-btn active">1</button><button class="page-btn" disabled aria-label="下一页">›</button><span>10条/页</span>`;$('first-key').classList.toggle('hidden',selected.history.length>0);$('first-key').style.marginTop='16px';$('list-view').classList.add('hidden');$('detail-view').classList.remove('hidden');$('detail-crumb').classList.remove('hidden');window.scrollTo({top:0});}
function showList(event){if(event)event.preventDefault();$('list-view').classList.remove('hidden');$('detail-view').classList.add('hidden');$('detail-crumb').classList.add('hidden')}
$('filters').onsubmit=e=>{e.preventDefault();search()};$('reset-filters').onclick=()=>{$('filters').reset();search()};$('collapse').onclick=()=>{const collapsed=$('filters').classList.toggle('collapsed');$('collapse').textContent=collapsed?'展开⌄':'收拢⌃';$('collapse').setAttribute('aria-expanded',String(!collapsed))};$('pager').onclick=e=>{const b=e.target.closest('[data-page]');if(b&&!b.disabled){page=Number(b.dataset.page);render()}};
$('terminal-rows').onclick=e=>{const b=e.target.closest('[data-action]');if(!b)return;const r=records.find(x=>x.id===Number(b.dataset.id));if(b.dataset.action==='details')details(r.id);else if(b.dataset.action==='activation'){toast(r.activation==='已开通'?'该终端已开通报税服务':'演示页面：开通操作需要接入报税业务接口')}else toast('演示页面：关闭操作需要接入报税业务接口')};
['back','breadcrumb-list','terminal-nav','tax-nav'].forEach(id=>$(id).onclick=showList);$('agency').onchange=()=>toast('当前为本地演示，未切换真实机构数据');$('help').onclick=()=>toast('支持筛选、分页、查看详情及首次录入演示；所有数据仅保留在当前页面');$('first-key').onclick=()=>{$('key-form').reset();$('key-dialog').showModal()};['close-dialog','cancel-dialog'].forEach(id=>$(id).onclick=()=>$('key-dialog').close());$('key-form').onsubmit=e=>{e.preventDefault();const code=$('code-input').value.trim(),key=$('key-input').value.trim();if(!code||!key){toast('请输入 Code 和 API Key',true);return}if(selected.history.length)return;selected.history.unshift({code,key,at:new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',dateStyle:'short',timeStyle:'medium'}).format(new Date()),by:'手工录入（演示用户）'});$('key-dialog').close();details(selected.id);toast('示例参数已录入，仅保留在当前页面')};
function clock(){const now=new Date();$('clock').textContent=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(now)+' '+new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',weekday:'long'}).format(now)}clock();setInterval(clock,1000);render();
</script>
</body>
</html>
